<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS App Store Icon Extractor 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>iOS App Store Icon Extractor 2.0</h1>
            <p>Enter an iTunes/App Store Product URL to extract all available high-resolution app icon dimensions.</p>
        </header>
        <main>
            <div class="input-section">
                <input type="text" id="appUrl" placeholder="https://apps.apple.com/us/app/instagram/id389801252" />
                <button id="extractBtn">Extract Icons</button>
            </div>
            <div id="loader" class="hidden">Processing...</div>
            <div id="error" class="error hidden"></div>
            <div id="results" class="results-grid hidden"></div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
